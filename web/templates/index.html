<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entertainment Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<audio id="player"></audio>

<div class="wrap">
  <div class="wood-frame">
    <div class="frame-label">Entertainment Box</div>
    <div class="dial-shell">
      <div class="now-playing" id="now-playing">NO SIGNAL</div>
      <div class="dial-scale-wrap">
        <svg viewBox="0 0 300 190" id="dial-svg">
          <g id="ticks"></g>
          <g id="station-markers"></g>
          <circle class="hub" cx="150" cy="150" r="46"/>
          <g class="knurl" id="knurl"></g>
          <circle class="hub-inner" cx="150" cy="150" r="34"/>
          <g class="needle" id="needle">
            <circle class="tip-ring" cx="150" cy="58" r="6.5"/>
            <circle class="tip" cx="150" cy="58" r="3.4"/>
          </g>
          <text class="freq-readout" x="150" y="145" id="freq-readout">--.-</text>
          <text class="freq-unit" x="150" y="158">CYCLES/SEC</text>
          <circle class="hub-hit" id="hub-hit" cx="150" cy="150" r="46"/>
        </svg>
      </div>
      <div class="signal-viewport">
        <div class="signal-bars" id="signal-bars"></div>
        <div class="signal-status">
          <span id="signal-label">NO SIGNAL</span>
          <span id="play-state" class="play-state">PAUSED</span>
          <span class="lock-state" id="lock-state">NO LOCK</span>
        </div>
      </div>
    </div>
    <div class="frame-label-bottom">Imperial Radio Directorate</div>
  </div>

  <p class="status" id="status"></p>
  <button id="rescan-btn" class="rescan-btn">Rescan Library</button>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
